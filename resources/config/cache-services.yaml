# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/cache/resources/config/cache-services.yaml' }
#
# Registers key generation without selecting or replacing an application cache
# pool. Consumers configure their own PSR-6 or PSR-16 backend and lifetime.

parameters:
    derafu.cache.key.max_length: 250

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Derafu\Cache\Contract\CacheKeyInterface:
        class: Derafu\Cache\CacheKey
        arguments:
            $maxLength: '%derafu.cache.key.max_length%'

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Cache\Translation\CacheTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
